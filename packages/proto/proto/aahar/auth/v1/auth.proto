syntax = "proto3";

package aahar.auth.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

service AuthService {
  rpc RequestOtp(RequestOtpRequest) returns (RequestOtpResponse) {}
  rpc VerifyOtp(VerifyOtpRequest) returns (VerifyOtpResponse) {}
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {}
}

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_STUDENT = 1;
  USER_ROLE_STAFF = 2;
  USER_ROLE_SUDO = 3;
}

message User {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string.max_len = 256];
  UserRole role = 3;
  string phone_number = 4 [
    (buf.validate.field).string.min_len = 10,
    (buf.validate.field).string.max_len = 15
  ];
  bool is_blacklisted = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message RequestOtpRequest {
  string phone_number = 1 [(buf.validate.field).string.min_len = 10];
}

message RequestOtpResponse {
  int32 expiry_time = 1;
  int32 retry_cooldown = 2;
}

message VerifyOtpRequest {
  string phone_number = 1 [(buf.validate.field).string.min_len = 10];
  string otp = 2 [(buf.validate.field).string.len = 6];
}

message VerifyOtpResponse {
  string access_token = 1;
  string refresh_token = 2;
  User user = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
}
